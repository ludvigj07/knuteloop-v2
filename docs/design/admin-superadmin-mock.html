<!doctype html>
<!--
  Knuteloop superadmin — klikkbar skisse (Ludvig, 2026-09-04).
  Bor I APPEN bak en «Knuteloop»-knapp (som knutesjef-knappen) — ingen egen nettside
  (ADR-0027 pkt 6). Se den på TELEFONBREDDE først: under 820 px blir radene kort, og det
  er den kanoniske visningen. Bred visning er iPad-varianten.
  Reglene bak skjermene: docs/superadmin-spec.md. Oppdatert 2026-09-04: baner
  RØD/GUL/GRØNN, «ta saken», uskarpt media, karantene i stedet for sletting, «Frys» uten
  nedlasting for nakenhet/mindreårig, «Ny sak», «Se som» bak støttesak.
-->
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knuteloop admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

/* Tokens fra apps/mobile/lib/theme.ts og .claude/skills/knuteloop-design */
:root{
  --paper:#FBF8EF; --ink:#0F1A2E; --card:#FFFFFF; --soft:#F3EFE2; --media:#F3F0E8;
  --primary:#12327D; --primary-bg:#E7EAF2;
  --accent:#FFCD29; --accent-bg:#FFF7DD; --accent-strong:#7B6A2C;
  --line:rgba(27,33,45,.16); --text-muted:#576175; --text-soft:#112D6C;
  --success:#2F9E63; --success-bg:rgba(47,158,99,.14); --success-ink:#1E6B42;
  --warning:#E6A417; --warning-bg:rgba(230,164,23,.16); --warning-ink:#7A5407;
  --danger:#D6483F; --danger-strong:#B53A32; --danger-bg:rgba(214,72,63,.12);
  --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:26px; --r-full:999px;
  --sh:3px 3px 0 0 var(--ink); --sh-sm:2px 2px 0 0 var(--ink); --sh-lg:5px 5px 0 0 var(--ink);
  --fd:'Bricolage Grotesque','Inter',sans-serif;
  --fs:'Inter',system-ui,-apple-system,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ez:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fs);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--fd);font-weight:800;letter-spacing:-.03em;line-height:1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
:where(button,a,input,select,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:var(--fm)}
.mut{color:var(--text-muted)}

/* ---------------- Shell ---------------- */
.app{display:grid;grid-template-columns:1fr;min-height:100dvh}
.rail{position:sticky;top:0;z-index:40;background:var(--ink);color:var(--paper);border-bottom:2px solid var(--ink)}
.railtop{display:flex;align-items:center;gap:9px;padding:11px 14px 9px}
.railtop .logo{width:34px;height:20px;color:var(--accent);flex:none}
.railtop .nm{font-family:var(--fd);font-weight:800;font-size:1.05rem}
.railtop .season{margin-left:auto;font-family:var(--fm);font-size:.68rem;font-weight:700;color:var(--accent);border:1.5px solid rgba(251,248,239,.3);padding:2px 7px;border-radius:var(--r-full);white-space:nowrap}
nav.nav{display:flex;gap:3px;padding:0 10px 10px;overflow-x:auto;scrollbar-width:none}
nav.nav::-webkit-scrollbar{display:none}
.nv{display:flex;align-items:center;gap:7px;flex:none;background:transparent;border:1.5px solid transparent;color:rgba(251,248,239,.72);border-radius:var(--r-full);padding:7px 12px;font-weight:600;font-size:.85rem;white-space:nowrap}
.nv:hover{color:var(--paper);border-color:rgba(251,248,239,.35)}
.nv.on{background:var(--paper);color:var(--ink);font-weight:700}
.nv svg{width:16px;height:16px;flex:none}
.nv .n{font-family:var(--fm);font-size:.66rem;font-weight:700;background:var(--danger);color:#fff;border-radius:8px;padding:1px 5px;min-width:17px;text-align:center}
.nv.on .n{background:var(--ink);color:var(--paper)}
.who{display:none;padding:10px 14px;border-top:1.5px solid rgba(251,248,239,.16);font-size:.78rem;color:rgba(251,248,239,.62)}
.who b{display:block;color:var(--paper);font-size:.86rem}
.main{min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:flex-end;gap:12px;padding:18px 16px 12px;flex-wrap:wrap}
.bar h1{font-size:clamp(1.7rem,6vw,2.2rem)}
.bar .sub{font-size:.86rem;color:var(--text-muted);width:100%}
.view{padding:0 16px 60px;min-width:0}
@media(min-width:900px){
  .app{grid-template-columns:232px 1fr}
  .rail{height:100dvh;border-bottom:0;border-right:2px solid var(--ink);display:flex;flex-direction:column}
  .railtop{padding:18px 16px 14px}
  .railtop .season{display:none}
  nav.nav{flex-direction:column;overflow:visible;padding:0 12px;gap:2px}
  .nv{width:100%}
  .nv .n{margin-left:auto}
  .who{display:block;margin-top:auto}
  .bar{padding:26px 28px 16px}
  .view{padding:0 28px 70px}
}

/* ---------------- Bits ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border:2px solid var(--ink);border-radius:var(--r-md);background:var(--card);font-weight:700;font-size:.88rem;box-shadow:var(--sh-sm);transition:transform .1s var(--ez),box-shadow .1s var(--ez);white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:var(--sh)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.pri{background:var(--primary);color:var(--paper)}
.btn.acc{background:var(--accent)}
.btn.dan{background:var(--danger);color:#fff}
.btn.gh{border-color:var(--line);box-shadow:none;background:transparent}
.btn.gh:hover{background:var(--card);border-color:var(--ink);transform:none;box-shadow:none}
.btn.sm{min-height:32px;padding:0 10px;font-size:.8rem;border-radius:var(--r-sm)}
.btn.full{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none;box-shadow:none}
.btn svg{width:16px;height:16px;flex:none}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 9px;border:1.5px solid var(--ink);border-radius:var(--r-full);font-size:.74rem;font-weight:700;background:var(--card);white-space:nowrap;line-height:1}
.chip svg{width:13px;height:13px}
.chip.ok{background:var(--success-bg);border-color:var(--success);color:var(--success-ink)}
.chip.wa{background:var(--warning-bg);border-color:var(--warning);color:var(--warning-ink)}
.chip.da{background:var(--danger-bg);border-color:var(--danger);color:var(--danger-strong)}
.chip.mu{background:var(--soft);border-color:var(--line);color:var(--text-muted)}
.chip.pr{background:var(--primary-bg);border-color:var(--primary);color:var(--primary)}
.chip.ac{background:var(--accent)}
.chip.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.tap{cursor:pointer}.tap:hover{box-shadow:var(--sh-sm)}

.card{border:2px solid var(--ink);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--sh);padding:14px}
.card.flat{box-shadow:none}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.sec{font-size:.74rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 9px}
.sec:first-child{margin-top:0}

.stat{border:2px solid var(--ink);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--sh);padding:13px;text-align:left;display:block;width:100%}
.stat .v{font-family:var(--fm);font-weight:700;font-size:clamp(1.5rem,5.5vw,2rem);line-height:1}
.stat .l{font-size:.78rem;color:var(--text-muted);font-weight:600;margin-top:5px}
.stat.hot{background:var(--accent)}
.stat.bad{background:var(--danger-bg);border-color:var(--danger)}
.stat.tap:hover{transform:translate(-2px,-2px);box-shadow:var(--sh-lg);transition:transform .1s var(--ez),box-shadow .1s var(--ez)}

.banner{display:flex;align-items:center;gap:10px;padding:11px 14px;border:2px solid var(--ink);border-radius:var(--r-md);margin-bottom:14px;font-size:.88rem;flex-wrap:wrap}
.banner b{font-weight:700}
.banner svg{width:18px;height:18px;flex:none}
.banner .btn{margin-left:auto}
.banner.ok{background:var(--success-bg)}
.banner.wa{background:var(--accent-bg)}
.banner.da{background:var(--danger);color:#fff;border-color:var(--ink)}
.banner.da .btn{background:#fff;color:var(--ink)}

/* Lists / tables */
.th{display:none}
.r{display:grid;gap:7px;grid-template-columns:1fr;padding:12px;border:2px solid var(--ink);border-radius:var(--r-md);background:var(--card);margin-bottom:7px;align-items:center}
.r.sel{background:var(--accent-bg);box-shadow:var(--sh-sm)}
.r.off{opacity:.5}
.r .c{min-width:0;font-size:.88rem}
.r .c > b.k{display:block;font-size:.66rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:1px}
.r .t{font-weight:700}
.r .s{font-size:.8rem;color:var(--text-muted)}
@media(min-width:820px){
  .r{grid-template-columns:var(--c);gap:10px}
  .th{display:grid;grid-template-columns:var(--c);gap:10px;padding:0 12px 7px;font-size:.68rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
  .r .c > b.k{display:none}
}
.empty{padding:34px 16px;text-align:center;color:var(--text-muted);border:2px dashed var(--line);border-radius:var(--r-lg)}
.empty .kn{width:44px;height:25px;color:var(--primary);margin:0 auto 8px}
.empty h4{font-size:1.05rem;margin-bottom:4px;color:var(--ink)}

/* Media placeholder */
.med{border:2px solid var(--ink);border-radius:var(--r-md);background:repeating-linear-gradient(135deg,#F3F0E8 0 9px,#E8E3D4 9px 11px);min-height:150px;display:grid;place-items:center;position:relative;overflow:hidden}
.med svg.ph{width:30px;height:30px;color:#9AA3B5}
.med .tg{position:absolute;left:8px;top:8px}
.med .veil{position:absolute;inset:0;background:rgba(15,26,46,.74);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:.85rem;text-align:center;padding:12px}
.med .veil svg{width:22px;height:22px}
.med.txt{background:var(--soft);font-family:var(--fd);font-weight:700;padding:16px;text-align:center;font-size:1rem;line-height:1.2}
/* Uskarpt + gråtoner til du trykker «Vis» (Cinder-standard; forskning: mindre belastning, samme treffsikkerhet) */
.medwrap{position:relative}
.medwrap .med.blur{filter:grayscale(1) blur(7px)}
.medwrap .reveal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.medwrap .reveal:hover{transform:translate(-50%,-50%) translate(-1px,-1px)}
.medwrap .reveal:active{transform:translate(-50%,-50%) translate(2px,2px)}
.police{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border:2px solid var(--danger);border-radius:var(--r-md);background:var(--danger-bg);font-size:.85rem;margin-bottom:12px}
.police b{font-family:var(--fm);font-size:1rem}

/* Detail panel */
.dp{border:2px solid var(--ink);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--sh-lg);padding:16px;margin-bottom:14px}
.dp .hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.dp .hd h3{font-size:1.25rem;flex:1;min-width:160px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.87rem;margin:0 0 12px}
.dl dt{font-weight:700;color:var(--text-muted)}
.dl dd{margin:0}
.quote{border:2px dashed var(--line);border-radius:var(--r-md);background:var(--soft);padding:11px;font-size:.87rem;margin-bottom:12px}
.quote b{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:3px}
.split{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.split{grid-template-columns:190px 1fr}}
.bry{display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
@media(min-width:900px){.bry{grid-template-columns:minmax(0,1fr) 250px}.bry > div:last-child{position:sticky;top:20px}}
.bry .sec:first-child{margin-top:0}

/* Modal */
.mask{position:fixed;inset:0;background:rgba(15,26,46,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fd .16s var(--ez)}
@media(min-width:700px){.mask{align-items:center;padding:20px}}
.mod{width:100%;max-width:460px;background:var(--card);border:2px solid var(--ink);border-radius:24px 24px 0 0;padding:16px 16px 22px;max-height:92dvh;overflow:auto;animation:up .22s var(--ez)}
@media(min-width:700px){.mod{border-radius:var(--r-xl);box-shadow:var(--sh-lg);animation:pp .18s var(--ez)}}
@keyframes fd{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pp{from{transform:scale(.96);opacity:0}}
.mod h3{font-size:1.3rem;margin-bottom:5px}
.mod > p{font-size:.87rem;color:var(--text-muted);margin-bottom:13px}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 13px;border:2px solid var(--ink);border-radius:var(--r-md);background:var(--card);margin-bottom:7px;font-weight:600}
.opt.on{background:var(--accent-bg);box-shadow:var(--sh-sm)}
.opt .dot{width:19px;height:19px;border:2px solid var(--ink);border-radius:50%;flex:none;display:grid;place-items:center}
.opt.on .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink)}
.opt small{display:block;font-weight:500;font-size:.78rem;color:var(--text-muted)}
.seg{display:flex;gap:3px;border:2px solid var(--ink);border-radius:var(--r-full);padding:3px;background:var(--card);margin-bottom:11px}
.seg button{flex:1;border:0;background:transparent;border-radius:var(--r-full);height:33px;font-weight:700;font-size:.83rem}
.seg button.on{background:var(--ink);color:var(--paper)}
.lb{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin:9px 0 5px}
.in{width:100%;border:2px solid var(--ink);border-radius:var(--r-sm);padding:9px 11px;background:var(--card);margin-bottom:9px}

/* Toggles */
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:11px 13px;border:2px solid var(--ink);border-radius:var(--r-md);background:var(--card);margin-bottom:7px}
.sw b{display:block}
.sw small{color:var(--text-muted);font-size:.78rem}
.sw .t{width:48px;height:28px;border:2px solid var(--ink);border-radius:var(--r-full);background:var(--danger-bg);position:relative;flex:none}
.sw .t::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--ink);transition:transform .16s var(--ez)}
.sw.on .t{background:var(--success)}
.sw.on .t::after{transform:translateX(20px)}

/* Mini phone preview */
.mini{border:2px solid var(--ink);border-radius:24px;background:var(--paper);box-shadow:var(--sh);padding:11px;max-width:220px}
.mini .st{display:flex;justify-content:space-between;font-family:var(--fm);font-size:10px;font-weight:700;margin-bottom:6px}
.mini .h{font-family:var(--fd);font-weight:800;font-size:1rem;margin-bottom:7px}
.mini .it{display:flex;align-items:center;gap:7px;padding:7px 9px;border:1.5px solid var(--ink);border-radius:var(--r-sm);background:var(--card);margin-bottom:5px;font-size:.79rem;font-weight:700}
.mini .it svg{width:16px;height:16px;flex:none}
.mini .it.off{opacity:.4;background:var(--soft);text-decoration:line-through}
.mini .it .x{margin-left:auto;font-size:.64rem;color:var(--danger-strong);text-decoration:none;font-weight:700}

/* Bars + spark */
.bars{display:grid;gap:7px}
.bl{display:grid;grid-template-columns:118px 1fr 58px;gap:9px;align-items:center;font-size:.85rem}
.bl .bb{height:16px;border:1.5px solid var(--ink);border-radius:var(--r-full);background:var(--card);overflow:hidden}
.bl .bb i{display:block;height:100%;background:var(--primary)}
.bl .vv{font-family:var(--fm);font-weight:700;text-align:right;font-size:.82rem}
.spark{display:flex;align-items:flex-end;gap:2px;height:22px}
.spark i{display:block;width:6px;background:var(--primary);border-radius:2px 2px 0 0}
.days{font-family:var(--fm);font-weight:700}
.days.w{color:var(--warning-ink)}
.days.d{color:var(--danger-strong)}

/* Toast */
#tst{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(14px);opacity:0;z-index:120;background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:var(--r-md);padding:11px 15px;box-shadow:4px 4px 0 0 var(--accent);font-weight:600;font-size:.88rem;max-width:calc(100vw - 28px);pointer-events:none;transition:opacity .16s,transform .16s var(--ez)}
#tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="railtop">
      <svg class="logo" viewBox="0 0 100 56" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M 38,28 C 44,38 56,40 66,34 L 100,28"/><path d="M 0,28 C 16,28 20,12 32,8 C 44,4 60,6 68,18 C 76,30 70,46 56,50 C 42,54 28,46 28,36 C 28,24 36,16 46,16 C 56,16 64,22 66,28"/></svg>
      <span class="nm">Admin</span>
      <span class="season">Dag 8</span>
    </div>
    <nav class="nav" id="nav" aria-label="Meny"></nav>
    <div class="who"><b>Ludvig</b>owner · dag 8 av russetiden · vakt i dag: Brage<br><span style="opacity:.7">Bor i appen bak «Knuteloop»-knappen. Telefonbredde er fasit.</span></div>
  </aside>
  <main class="main">
    <div class="bar"><h1 id="ttl"></h1><span class="sub" id="sub"></span></div>
    <div class="view" id="view"></div>
  </main>
</div>
<div id="modal"></div>
<div id="tst" role="status" aria-live="polite"></div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const nb=new Intl.NumberFormat('nb-NO');
const clock=()=>new Date().toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'});
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fnv(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return (h>>>0).toString(16).padStart(8,'0');}

const ic=(d,x='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" ${x}>${d}</svg>`;
const I={
 home:ic('<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>'),
 flag:ic('<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>'),
 star:ic('<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.3L12 17.5 6.5 20.4l1-6.3L3 9.7l6.2-.9z"/>'),
 grid:ic('<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'),
 shield:ic('<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9.5 12l2 2 3.5-4"/>'),
 chart:ic('<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>'),
 power:ic('<path d="M12 3v9"/><path d="M6.3 7.3a8 8 0 1011.4 0"/>'),
 book:ic('<path d="M5 4h13a1 1 0 011 1v15H6a1 1 0 01-1-1z"/><path d="M9 8h7M9 12h7"/>'),
 eye:ic('<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),

  <div class="grid g3">${[['Bamsen','Morgenfugl',20,'i dag'],['Tante Sofie','Bussen',25,'i dag'],['Ravnen','Konfetti',40,'i går'],['Lynet','Dobbelt opp',50,'i går'],['Frost','Trappa',15,'i går'],['Isbjørn','Bibliotekaren',30,'2 dager']].map(([r,k,p,t])=>`<div class="card">${medias({h:110})}<h4 style="font-size:1rem;margin:8px 0 3px">${k}</h4><div class="s mut" style="font-size:.8rem">${r} · ${t}</div><div class="chips" style="margin-top:6px"><span class="chip ac mono">+${p} P</span></div></div>`).join('')}</div>

 }

 return `<div class="th" style="--c:1.5fr 70px 1.1fr 60px 110px 80px 90px"><span>Skole</span><span>Russ</span><span>Knutesjefer</span><span>Kø</span><span>Sist moderert</span><span>7 dager</span><span></span></div>
 ${sorted.map(s=>`<div class="r" style="--c:1.5fr 70px 1.1fr 60px 110px 80px 90px">
  <div class="c"><span class="t">${s.n}</span></div>
  <div class="c"><b class="k">Russ</b><span class="mono">${nb.format(s.russ)}</span></div>
  <div class="c"><b class="k">Knutesjefer</b>${s.ks.length?s.ks.join(', '):'<span class="chip da">Ingen</span>'}</div>
  <div class="c"><b class="k">Kø</b><span class="mono" style="font-weight:700">${s.ko}</span></div>
  <div class="c"><b class="k">Sist moderert</b><span class="days ${dayCls(s.d)}">${dayTxt(s.d)}</span></div>
  <div class="c"><b class="k">7 dager</b>${spark(s.akt)}</div>

 return `<div class="row-btns" style="margin-bottom:14px"><button class="btn acc" data-act="ny-ks">${I.plus} Ny knutesjef</button></div>
 <div class="th" style="--c:1.2fr 1.2fr 90px 130px 120px 150px"><span>Knutesjef</span><span>Skole</span><span>Sist inne</span><span>Godkjent / avvist</span><span>Snitt tid per sak</span><span></span></div>
 ${S.ks.map(k=>{

  return `<div class="r ${k.status==='suspendert'?'off':''}" style="--c:1.2fr 1.2fr 90px 130px 120px 150px">
  <div class="c"><span class="t">${k.rn}</span><div class="s">${k.navn}</div>${k.status==='suspendert'?'<span class="chip da" style="margin-top:4px">Suspendert</span>':''}</div>

/* ============================ MODALS ============================ */
const BAN=[[24,'24 timer'],[168,'7 dager'],[-1,'Permanent']];
const GRUNN=['Trakassering','Upassende innhold','Rett til eget bilde','Gjentatt regelbrudd','Annet'];
function renderModal(){
 const m=$('#modal');
 if(!S.modal){m.innerHTML='';return;}
 if(S.modal==='ban'){
  const r=S.rapporter.find(x=>x.id===S.sel), d=S.draft;
  const dur=BAN.find(b=>b[0]===d.dur)[1];
  m.innerHTML=`<div class="mask" data-act="lukk"><div class="mod">
   <h3>Utesteng ${r.russ}</h3><p>Innholdet fjernes samtidig. ${r.navn}, ${r.school}.</p>
   <div class="lb">Hvor lenge</div>
   <div class="seg">${BAN.map(([v,l])=>`<button class="${d.dur===v?'on':''}" data-act="ban-dur" data-v="${v}">${l}</button>`).join('')}</div>
   <div class="lb">Grunn</div>
   ${GRUNN.map(g=>`<button class="opt ${d.grunn===g?'on':''}" data-act="ban-grunn" data-v="${g}"><span class="dot"></span><span>${g}</span></button>`).join('')}
   <div class="quote" style="margin-top:11px"><b>Dette får ${r.russ} se i appen (Din status)</b>Innlegget ditt for «${r.knute}» er fjernet, og du kan ikke ${d.dur===-1?'sende inn resten av sesongen':'sende inn i '+dur.toLowerCase()}. Grunn: ${d.grunn.toLowerCase()}. Grunnlag: ${d.grunn==='Rett til eget bilde'?'åndsverkloven § 104':'Knuteloops retningslinjer'}. Poengene for denne knuten er trukket; resten er trygge. Du kan klage innen 30 dager.</div>
   <p class="mut" style="font-size:.78rem;margin-bottom:11px">Fem faste felt: hva, grunn, grunnlag, om det kom fra et varsel (aldri hvem), klagevei. ${d.dur===-1?'<b>Permanent krever fire øyne</b> — en annen med operator-nivå må bekrefte fra sin telefon.':''}</p>
   <div class="row-btns"><button class="btn gh" data-act="lukk">Avbryt</button><button class="btn dan" style="flex:1" data-act="ban-do">Fjern og utesteng</button></div>
  </div></div>`;
 }
 if(S.modal==='ny-ks'){
  const d=S.draft;
  const ledige=S.skoler.filter(s=>s.ks.length<2);
  m.innerHTML=`<div class="mask" data-act="lukk"><div class="mod">
   <h3>Ny knutesjef</h3><p>Personen får knutesjef-tilgang på én skole. Rollen varer sesongen ut.</p>
   <div class="lb">Skole</div>
   <select class="in" data-in="skole">${ledige.map(s=>`<option value="${s.id}" ${d.skole===s.id?'selected':''}>${s.n} (${s.ks.length} av 2)</option>`).join('')}</select>
   <div class="lb">Navn</div><input class="in" data-in="navn" value="${esc(d.navn)}" placeholder="Fornavn og etternavn">
   <div class="lb">E-post</div><input class="in" data-in="epost" value="${esc(d.epost)}" placeholder="navn@skole.no">
   <div class="quote"><b>Før tilgangen aktiveres</b>Personen må godta ansvaret for moderering på sin skole i appen. Godkjenningen lagres med tidspunkt. Uten den er tilgangen ikke aktiv.</div>
   <div class="row-btns"><button class="btn gh" data-act="lukk">Avbryt</button><button class="btn pri" style="flex:1" data-act="ks-ny-do" ${d.navn.trim()?'':'disabled'}>Send invitasjon</button></div>
  </div></div>`;
 }
 if(S.modal==='suspend'){
  const k=S.ks.find(x=>x.id===S.draft.id);
  const skole=S.skoler.find(s=>s.n===k.skole);
  const alene=skole.ks.length<=1;
  m.innerHTML=`<div class="mask" data-act="lukk"><div class="mod">
   <h3>Suspender ${k.rn}</h3><p>${k.navn}, ${k.skole}. Tilgangen stenges umiddelbart.</p>
   ${alene?`<div class="banner da" style="margin-bottom:12px">${I.alert}<span>Dette er den eneste knutesjefen på skolen. Køen på ${skole.ko} saker blir stående til noen andre får tilgang.</span></div>`:''}
   <div class="quote"><b>Du tar praten selv</b>Systemet varsler ikke russestyret. Du ringer dem.</div>
   <div class="row-btns"><button class="btn gh" data-act="lukk">Avbryt</button><button class="btn dan" style="flex:1" data-act="suspend-do">Suspender tilgang</button></div>
  </div></div>`;
 }
 if(S.modal==='freeze'){
  const r=S.rapporter.find(x=>x.id===S.sel);
  // Nakenhet / mindreårig: aldri nedlasting — å laste ned er straffbart i seg selv. Politiet får tilgang via formell forespørsel.
  m.innerHTML=`<div class="mask" data-act="lukk"><div class="mod">
   <h3>Frys bevis</h3><p>Sak ${r.id}, ${r.school}. Krever fire øyne: en annen med owner-nivå må bekrefte fra sin telefon innen 60 min.</p>
   <div class="quote"><b>Dette skjer</b>Innsending, media, saken og loggsporet låses mot sletting — også mot at brukeren sletter kontoen (GDPR art. 17(3)(e)). Innholdet forblir skjult for alle.</div>
   ${r.noExport
     ?`<div class="quote" style="border-color:var(--danger)"><b>Ingen nedlasting</b>Dette gjelder nakenhet eller en mulig mindreårig. Ingen fil, ingen bevispakke, ingen skjermbilder. Politiet får tilgang via formell forespørsel — meld via tips.kripos.no.</div>`
     :`<div class="quote"><b>Bevispakke</b>Etter bekreftelse kan du laste ned en zip (media + metadata + logg-utdrag) med SHA-256-sum, via en lenke som varer 15 min. Nedlastingen logges.</div>`}
   <div class="quote"><b>Dette skjer ikke</b>Ingen melding sendes automatisk noe sted. Politianmeldelse gjør du selv — «Eskaler til politi» på saken gir sjekklista.</div>
   <div class="row-btns"><button class="btn gh" data-act="lukk">Avbryt</button><button class="btn dan" style="flex:1" data-act="freeze-do">${I.snow} ${r.noExport?'Frys':'Frys (nedlasting etter bekreftelse)'}</button></div>
  </div></div>`;
 }
 if(S.modal==='ny-sak'){
  const d=S.draft;
  const TYPER=[['Bilde av meg','gul'],['Klage på utestenging','gul'],['Innsyn / sletting (GDPR)','gul'],['Politiforespørsel','gul'],['Knutesjef er anklaget','gul'],['Rapportør-misbruk','gul'],['Fare for liv','rod'],['Annet','gronn']];
  m.innerHTML=`<div class="mask" data-act="lukk"><div class="mod">
   <h3>Ny sak</h3><p>Døra inn for telefon og e-post. Først når saken finnes ser du noe.</p>
   <div class="lb">Skole</div>
   <select class="in" data-in="skole">${S.skoler.map(s=>`<option value="${s.id}" ${d.skole===s.id?'selected':''}>${s.n}</option>`).join('')}</select>
   <div class="lb">Type</div>
   ${TYPER.map(([t,sev])=>`<button class="opt ${d.type===t?'on':''}" data-act="ny-sak-type" data-v="${t}" data-sev="${sev}"><span class="dot"></span><span>${t}</span>${laneChip(sev)}</button>`).join('')}
   <div class="lb">Hvem gjelder det (eksakt russenavn, eller innsendings-ID fra knutesjefen)</div>
   <input class="in" data-in="maal" value="${esc(d.maal)}" placeholder="f.eks. Tåkefyrsten eller INN-8812">
   <div class="quote"><b>Ikke et søk</b>Feltet må treffe eksakt. Det finnes ingen liste over brukere å bla i.</div>
   <div class="row-btns"><button class="btn gh" data-act="lukk">Avbryt</button><button class="btn pri" style="flex:1" data-act="ny-sak-do" ${d.type&&d.maal.trim()?'':'disabled'}>Opprett sak</button></div>
  </div></div>`;
 }
 if(S.modal==='stotte'){
  const s=S.skoler.find(x=>x.id===S.draft.skole), d=S.draft;
  const GR=['Skolen melder tom feed','Onboarding-hjelp','Rapport peker på mønster','Annet (krever notat)'];
  m.innerHTML=`<div class="mask" data-act="lukk"><div class="mod">
   <h3>Støttesak · ${s.n}</h3><p>Gir deg 30 minutter kun-lesing av det russen ser. Eget token, mørk ramme i appen, rad i loggen.</p>
   <div class="lb">Grunn</div>
   ${GR.map(g=>`<button class="opt ${d.grunn===g?'on':''}" data-act="stotte-grunn" data-v="${g}"><span class="dot"></span><span>${g}</span></button>`).join('')}
   <div class="quote"><b>Du får ikke se</b>Private innsendinger, køen, skjult innhold, topplista eller brukerlister. Det åpnes bare fra en konkret sak.</div>
   <div class="row-btns"><button class="btn gh" data-act="lukk">Avbryt</button><button class="btn pri" style="flex:1" data-act="stotte-do">${I.eye} Start 30 min</button></div>
  </div></div>`;
 }
}

/* ============================ EVENTS ============================ */
document.addEventListener('input',(e)=>{
 if(e.target.id==='lq'){S.logQ=e.target.value;const p=e.target.selectionStart;render();const n=$('#lq');if(n){n.focus();n.setSelectionRange(p,p);}return;}
 const k=e.target.dataset.in; if(k&&S.draft){S.draft[k]=e.target.value; if(k==='navn'||k==='maal'){const p=e.target.selectionStart;renderModal();const n=$(`[data-in="${k}"]`);if(n){n.focus();n.setSelectionRange(p,p);}}}
});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&S.modal){S.modal=null;S.draft=null;renderModal();}});
document.addEventListener('click',(e)=>{
 const go=e.target.closest('[data-go]');
 if(go){S.view=go.dataset.go;S.sel=null;S.seeAs=null;window.scrollTo({top:0});render();return;}
 const el=e.target.closest('[data-act]'); if(!el) return;
 const a=el.dataset.act, d=el.dataset;
 if(a==='lukk'&&e.target!==el) return;
 switch(a){
  case 'back': S.sel=null; render(); break;
  case 'open': S.sel=d.id; render(); break;
  case 'lukk': S.modal=null; S.draft=null; renderModal(); break;

  case 'claim':{
   const r=S.rapporter.find(x=>x.id===S.sel); r.claimed='Ludvig';
   LOG('Ludvig','Tok saken',`${r.id} · ${r.school}`);
   render(); toast('Du har saken. Tid til første handling er registrert.'); break;}
  case 'reveal':{
   S.revealed[d.id]=1; const r=S.rapporter.find(x=>x.id===d.id);
   LOG('Ludvig','Viste media',`${d.id}${r?' · '+r.school:''} · kryss-skole-lesing`);
   render(); break;}
  case 'rap':{
   const r=S.rapporter.find(x=>x.id===S.sel);
   S.rapporter=S.rapporter.filter(x=>x.id!==S.sel);
   S.ferdig.unshift({...r,utfall:d.v});
   if(d.v==='Fjernet'){LOG('Ludvig','Fjernet innhold',`${r.id} · ${r.knute} · ${r.school} · karantene 30 d · poeng for knuten trukket`);LOG('System','Begrunnelse sendt',`${r.russ} · ${r.id}`);}
   else if(d.v==='Til knutesjef'){LOG('Ludvig','Sendte saken tilbake til knutesjef',`${r.id} · ${r.school} · ikke vår`);}
   else LOG('Ludvig','Lot innhold stå',`${r.id} · ${r.knute} · ${r.school}`);
   S.sel=null; render();
   toast(d.v==='Fjernet'?'Fjernet. I karantene 30 dager, poeng for knuten trukket, begrunnelse sendt.':d.v==='Til knutesjef'?'Sendt til skolens kø med notat.':'Lot stå. Den som meldte får svar: «vi har sett på det, innlegget står».');
   break;}
  case 'restore':{
   const r=S.ferdig.find(x=>x.id===d.id); S.ferdig=S.ferdig.filter(x=>x.id!==d.id);
   S.rapporter.push({...r,claimed:null,utfall:undefined});
   LOG('Ludvig','Gjenopprettet',`${r.id} · ${r.knute} · ${r.school} · ut av karantene · poeng tilbake`);
   render(); toast('Gjenopprettet. Poengene er tilbake, Din status er oppdatert.'); break;}
  case 'ban-open': S.draft={dur:168,grunn:'Trakassering'}; S.modal='ban'; renderModal(); break;
  case 'ban-dur': S.draft.dur=+d.v; renderModal(); break;
  case 'ban-grunn': S.draft.grunn=d.v; renderModal(); break;
  case 'ban-do':{
   const r=S.rapporter.find(x=>x.id===S.sel), dur=BAN.find(b=>b[0]===S.draft.dur)[1];
   if(S.draft.dur===-1){
    // Permanent = fire øyne. Saken blir stående til en annen bekrefter.
    LOG('Ludvig','Ba om fire øyne: permanent utestenging',`${r.russ} · ${S.draft.grunn} · ${r.school} · ${r.id}`);
    S.modal=null;S.draft=null;render();toast('Venter på bekreftelse fra Brage (utløper om 60 min). Ingenting er gjort ennå.');
    break;
   }
   S.rapporter=S.rapporter.filter(x=>x.id!==S.sel);
   S.ferdig.unshift({...r,utfall:'Utestengt '+dur.toLowerCase()});
   LOG('Ludvig',`Utestengte ${r.russ}`,`${dur} · ${S.draft.grunn} · ${r.school} · ${r.id} · karantene 30 d`);
   LOG('System','Begrunnelse sendt',`${r.russ} · ${r.id} · Din status oppdatert`);
   S.modal=null;S.draft=null;S.sel=null;render();toast(`${r.russ} er utestengt ${dur.toLowerCase()} og har fått begrunnelsen.`);
   break;}
  case 'freeze': S.modal='freeze'; renderModal(); break;
  case 'freeze-do':{
   const r=S.rapporter.find(x=>x.id===S.sel);
   LOG('Ludvig','Ba om fire øyne: frys bevis',`${r.id} · ${r.school} · ${r.noExport?'ingen nedlasting':'bevispakke etter bekreftelse'}`);
   S.modal=null;render();toast(r.noExport?'Frys venter på bekreftelse. Ingen nedlasting for denne sakstypen.':'Frys venter på bekreftelse. Bevispakke kan lastes ned etterpå.');
   break;}
  case 'ny-sak': S.draft={skole:S.skoler[0].id,type:null,sev:'gul',maal:''}; S.modal='ny-sak'; renderModal(); break;
  case 'ny-sak-type': S.draft.type=d.v; S.draft.sev=d.sev; renderModal(); break;
  case 'ny-sak-do':{
   const s=S.skoler.find(x=>x.id===S.draft.skole), id='S-'+(4480+S.rapporter.length+S.ferdig.length);
   S.rapporter.push({id,sev:S.draft.sev,kind:S.draft.type,reason:'Manuell sak',school:s.n,knute:'—',russ:S.draft.maal.trim(),navn:'(slås opp)',by:'Ansatt',age:'nå',ks:s.ks.length?s.ks.join(', '):'Ingen knutesjef',note:'Opprettet manuelt. Det som kom inn på telefon/e-post skrives her.',media:0,hidden:0,hard:S.draft.sev==='rod'?1:0,noExport:0,claimed:'Ludvig'});
   LOG('Ludvig','Opprettet sak',`${id} · ${S.draft.type} · ${s.n}`);
   S.modal=null;S.draft=null;S.view='rapporter';S.sel=id;render();toast(`Sak ${id} opprettet. Nå kan du se det den peker på.`);
   break;}

  case 'ftab': S.feedTab=d.v; render(); break;
  case 'nom':{
   const n=S.noms.find(x=>x.id===d.id); n.done=d.v;
   if(d.v==='Publisert'){S.live.unshift({id:'L'+Date.now(),school:n.school,knute:n.knute,cat:n.cat,russ:n.russ,p:n.p,views:'0'});}
   LOG('Ludvig',d.v==='Publisert'?'Publiserte i nasjonal feed':'Avslo fra nasjonal feed',`${n.knute} · ${n.school}`);
   render(); toast(d.v==='Publisert'?`«${n.knute}» er offentlig nå.`:`Avslått. ${n.ks} får begrunnelsen.`);
   break;}
  case 'pull':{
   const l=S.live.find(x=>x.id===d.id); S.live=S.live.filter(x=>x.id!==d.id);
   LOG('Ludvig','Tok ned fra nasjonal feed',`${l.knute} · ${l.school}`);
   render(); toast(`«${l.knute}» er tatt ned. Ligger fortsatt på skolen.`);
   break;}

  case 'stotte': S.draft={skole:d.id,grunn:'Skolen melder tom feed'}; S.modal='stotte'; renderModal(); break;
  case 'stotte-grunn': S.draft.grunn=d.v; renderModal(); break;
  case 'stotte-do':{
   const s=S.skoler.find(x=>x.id===S.draft.skole), id='S-'+(4480+S.rapporter.length+S.ferdig.length+1);
   S.stotte={id,grunn:S.draft.grunn,min:30}; S.seeAs=s.id;
   LOG('Ludvig','Opprettet støttesak · så på skole',`${id} · ${s.n} · ${S.draft.grunn} · lese-token 30 min`);
   S.modal=null;S.draft=null;render(); break;}
  case 'seeas-end':{
   if(S.stotte) LOG('Ludvig','Avsluttet støttesak',`${S.stotte.id} · lese-token trukket`);
   S.seeAs=null; S.stotte=null; render(); break;}

  case 'ny-ks': S.draft={skole:S.skoler.find(s=>s.ks.length<2).id,navn:'',epost:''}; S.modal='ny-ks'; renderModal(); break;
  case 'ks-ny-do':{
   const s=S.skoler.find(x=>x.id===S.draft.skole);
   s.ks.push(S.draft.navn.split(' ')[0]);
   S.ks.push({id:'k'+Date.now(),rn:'(ikke valgt)',navn:S.draft.navn,skole:s.n,sist:'aldri',god:0,avv:0,rate:0,sek:0,status:'aktiv'});
   LOG('Ludvig','Inviterte knutesjef',`${S.draft.navn} · ${s.n}`);
   S.modal=null;S.draft=null;S.view='knutesjefer';render();toast('Invitasjon sendt. Tilgangen aktiveres når personen godtar ansvaret.');
   break;}
  case 'ks-off': S.draft={id:d.id}; S.modal='suspend'; renderModal(); break;
  case 'suspend-do':{
   const k=S.ks.find(x=>x.id===S.draft.id); k.status='suspendert';
   const s=S.skoler.find(x=>x.n===k.skole); if(s) s.ks=s.ks.filter(n=>n!==k.rn);
   LOG('Ludvig','Suspenderte knutesjef',`${k.rn} (${k.navn}) · ${k.skole}`);
   S.modal=null;S.draft=null;render();toast(`${k.rn} har ikke lenger tilgang. Ring russestyret.`);
   break;}
  case 'ks-on':{
   const k=S.ks.find(x=>x.id===d.id); k.status='aktiv';
   const s=S.skoler.find(x=>x.n===k.skole); if(s&&!s.ks.includes(k.rn)) s.ks.push(k.rn);
   LOG('Ludvig','Ga tilbake tilgang',`${k.rn} · ${k.skole}`);
   render();toast(`${k.rn} har tilgang igjen.`);
   break;}

  case 'dtab': S.dataTab=d.v; render(); break;
  case 'eksport': LOG('Ludvig','Eksporterte sponsorrapport',`${d.n} · aggregert`); toast('Lastet ned. Kun tall, ingen navn.'); render(); break;
  case 'eksport-logg': LOG('Ludvig','Eksporterte logg',S.logQ?`søk: ${S.logQ}`:'siste 30 dager'); toast('Loggen er eksportert som CSV.'); render(); break;

  case 'bryter':{
   const g=d.g, arr=S.brytere[g], f=arr.find(x=>(x.k||x.id)===d.k);
   f.on=f.on?0:1;
   const hva=g==='cat'?'kategori':g==='fn'?'funksjon':g==='kn'?'knute':'skole';
   LOG('Ludvig',f.on?'Skrudde på':'Skrudde av',`${f.n} · ${hva}`);
   render(); toast(`${f.n} er ${f.on?'på':'av'}. Slår inn i appen innen 5 minutter.`);
   break;}
 }
});
render();
</script>
</body>
</html>
